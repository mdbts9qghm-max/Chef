id: thai-curry-garnelen
name: Rotes Thai-Curry mit Garnelen & Reis
hauptkategorie: kalorienarm
kategorien_manuell: []
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Asiatisch
inspiration: null
schwierigkeit: leicht
zeit: {vorbereitung: 10, kochen: 20, wartezeit: 0}
ausstattung: ["Pfanne 28 cm mit hohem Rand oder Wok", "Topf ca. 2 l mit Deckel"]
zutaten:
  - gruppe: Reis
  - {id: reis, zutat: Basmatireis ungekocht, name: Basmatireis, g: 90, hinweis: "oder Jasminreis"}
  - gruppe: Curry
  - {id: garnelen, zutat: Garnelen roh geschält, name: Garnelen, g: 410, hinweis: "TK, über Nacht im Kühlschrank aufgetaut"}
  - {id: oel, zutat: Rapsöl, g: 10, anzeige: "1 EL"}
  - {id: currypaste, zutat: Rote Currypaste, g: 30, anzeige: "2 EL"}
  - {id: knoblauch, zutat: Knoblauch, g: 6, anzeige: "2 Zehen"}
  - {id: ingwer, zutat: Ingwer frisch, name: Ingwer, g: 5, anzeige: "1 cm Stück"}
  - {id: kokosmilch, zutat: Kokosmilch light, g: 200, hinweis: "½ Dose, gut geschüttelt"}
  - {id: bruehe, zutat: Gemüsebrühe zubereitet, name: Gemüsebrühe, g: 100, hinweis: "100 ml"}
  - {id: paprika, zutat: Paprika rot, name: rote Paprika, g: 150, anzeige: "1 Paprika"}
  - {id: soja, zutat: Sojasauce, g: 10, anzeige: "2 TL"}
  - {id: zitrone, zutat: Zitronensaft, g: 10, anzeige: "2 TL", hinweis: "oder Limettensaft"}
  - {id: fruehlingszwiebeln, zutat: Frühlingszwiebeln, g: 20, anzeige: "1 Stange"}
mise_en_place:
  - "{garnelen} am Vorabend im Kühlschrank auftauen, abspülen und trocken tupfen."
  - "{reis} waschen. {paprika} in 1 cm breite Streifen schneiden. {knoblauch} und {ingwer} fein reiben. {fruehlingszwiebeln} in Ringe schneiden."
schritte:
  - titel: Reis kochen
    text: "Reis mit 160 ml Wasser im Topf mit Deckel auf Stufe 9 von 9 aufkochen, dann auf Stufe 2 von 9 12 Minuten quellen und 5 Minuten ruhen lassen."
    timer_min: 12
  - titel: Paste anrösten
    text: "{oel} in der Pfanne auf Stufe 6 von 9 erhitzen. {currypaste}, Knoblauch und Ingwer 1 Minute unter Rühren anrösten, bis es intensiv duftet."
    timer_min: 1
  - titel: Currysauce
    text: "{kokosmilch} und {bruehe} angießen, glatt rühren und aufkochen. Paprika hineingeben und auf Stufe 5 von 9 4 Minuten köcheln, bis die Paprika bissfest ist."
    timer_min: 5
  - titel: Garnelen garen
    text: "Garnelen in die Sauce legen und auf Stufe 4 von 9 3–4 Minuten sanft köcheln. Garprobe: rundum rosa-orange, nicht mehr glasig, locker C-förmig gebogen (Kerntemperatur ca. 63 °C). Mit {soja} und {zitrone} abschmecken."
    timer_min: 4
zeitablauf:
  - "Reis zuerst aufsetzen. Während er quillt, entsteht das Curry in ca. 10 Minuten."
fehler:
  - "**Curry fade:** Paste nicht angeröstet. Lösung: 1 Minute in Öl anrösten, erst dann Flüssigkeit."
  - "**Garnelen zäh:** zu lange gekocht. Lösung: erst ganz zum Schluss hinein, nur 3–4 Minuten."
  - "**Zu scharf:** Currypasten sind unterschiedlich scharf. Lösung: mit 1 EL starten, nach Geschmack erhöhen."
anrichten: "Pro Teller die Hälfte des Reises und die Hälfte des Currys, mit Frühlingszwiebeln bestreut: {portion_g} pro Portion."
aufbewahrung:
  kuehlschrank_tage: 1
  einfrierbar: false
  aufwaermen: "Am besten frisch. Reste am nächsten Tag im Topf auf Stufe 4 von 9 3 Minuten, nur bis heiß."
varianten:
  - {titel: Mit Hähnchen, text: "400 g Hähnchenbrust in Streifen statt Garnelen, 6–7 Minuten köcheln bis 74 °C Kerntemperatur; dann 3 Tage haltbar.", aenderung: {"Garnelen roh geschält": -410, "Hähnchenbrustfilet roh": 400}}
  - {titel: Mehr kcal, text: "Reis auf 150 g erhöhen.", aenderung: {"Basmatireis ungekocht": 60}}
  - {titel: Mit Spinat, text: "100 g Babyspinat zum Schluss unterheben.", aenderung: {"Babyspinat": 100}}
tipps:
  - "Ein paar Blätter frisches Basilikum oder Koriander (falls vorhanden) obenauf machen es authentisch."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
