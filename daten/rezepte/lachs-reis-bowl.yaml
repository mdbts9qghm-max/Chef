id: lachs-reis-bowl
name: Lachs-Reis-Bowl mit Sriracha-Skyr
hauptkategorie: schnell
kategorien_manuell: []
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Asiatisch
inspiration:
  quelle: "TikTok-/Instagram-Trend „Salmon Rice Bowl“"
  link: null
  aenderungen: "Kewpie-Mayonnaise durch Sriracha-Skyr ersetzt (spart ca. 180 kcal pro Portion und bringt 5 g Protein), Lachs im Airfryer statt in der Pfanne mit Öl."
schwierigkeit: leicht
zeit: {vorbereitung: 5, kochen: 20, wartezeit: 0}
ausstattung: [Airfryer, "Topf ca. 2 l mit Deckel", Backpapier für den Airfryer]
zutaten:
  - gruppe: Reis
  - {id: reis, zutat: Basmatireis ungekocht, name: Basmatireis, g: 140, hinweis: "oder Sushi-Reis"}
  - gruppe: Lachs
  - {id: lachs, zutat: Lachsfilet ohne Haut roh, name: Lachsfilet, g: 350, hinweis: "TK, über Nacht im Kühlschrank aufgetaut"}
  - {id: soja, zutat: Sojasauce, g: 20, anzeige: "1 EL"}
  - {id: honig, zutat: Honig, g: 10, anzeige: "2 TL"}
  - gruppe: Sriracha-Skyr & Topping
  - {id: skyr, zutat: Skyr natur, g: 110}
  - {id: sriracha, zutat: Sriracha, g: 15, anzeige: "1 EL"}
  - {id: zitrone, zutat: Zitronensaft, g: 5, anzeige: "1 TL"}
  - {id: gurke, zutat: Salatgurke, name: Salatgurke, g: 150, anzeige: "⅓ Gurke"}
  - {id: fruehlingszwiebeln, zutat: Frühlingszwiebeln, g: 20, anzeige: "1 Stange"}
  - {id: sesamoel, zutat: Sesamöl geröstet, name: geröstetes Sesamöl, g: 8, anzeige: "1½ TL"}
mise_en_place:
  - "{lachs} am Vorabend im Kühlschrank auftauen und trocken tupfen. In 3 cm Würfel schneiden."
  - "{soja} und {honig} verrühren, die Lachswürfel darin wenden."
  - "{skyr}, {sriracha} und {zitrone} glatt rühren. {gurke} in dünne Scheiben, {fruehlingszwiebeln} in Ringe schneiden."
schritte:
  - titel: Reis kochen
    text: "{reis} waschen und mit 250 ml Wasser im Topf mit Deckel auf Stufe 9 von 9 aufkochen, auf Stufe 2 von 9 12 Minuten quellen und 5 Minuten ruhen lassen."
    timer_min: 12
  - titel: Lachs im Airfryer
    text: "Airfryer auf 200 °C 3 Minuten vorheizen. Lachswürfel auf Backpapier in den Korb legen (mit Abstand) und bei 200 °C 7–8 Minuten garen, bis die Ränder karamellisiert sind. Garprobe: Lachs ist innen saftig und blättert leicht auf; 50–55 °C Kerntemperatur für glasig, 60 °C für durch."
    timer_min: 8
  - titel: Bowl bauen
    text: "Reis mit einer Gabel auflockern und mit {sesamoel} mischen."
    timer_min: null
zeitablauf:
  - "Reis aufsetzen; nach 8 Minuten den Airfryer vorheizen. Lachs und Reis sind gleichzeitig fertig."
fehler:
  - "**Lachs trocken:** zu lange gegart. Lösung: ab Minute 6 prüfen, 55 °C reichen für saftigen Lachs."
  - "**Glasur verbrennt:** Honig ohne Backpapier direkt am Korb. Lösung: Backpapier unterlegen."
  - "**Reis klebt zu sehr:** nicht gewaschen. Lösung: waschen, bis das Wasser fast klar ist."
anrichten: "Pro Bowl die Hälfte des Reises, darauf die Hälfte der Lachswürfel, die Hälfte der Gurken, je 2 EL Sriracha-Skyr als Klecks und Frühlingszwiebeln: {portion_g} pro Portion."
aufbewahrung:
  kuehlschrank_tage: 1
  einfrierbar: false
  aufwaermen: "Lachs schmeckt auch kalt; Reis 1½ Minuten bei 600 W mit 1 EL Wasser."
  separat: "Gurke und Sriracha-Skyr getrennt lagern."
varianten:
  - {titel: Mit Garnelen, text: "350 g Garnelen statt Lachs, 6 Minuten im Airfryer.", aenderung: {"Lachsfilet ohne Haut roh": -350, "Garnelen roh geschält": 350}}
  - {titel: Weniger kcal, text: "Reis auf 100 g reduzieren.", aenderung: {"Basmatireis ungekocht": -40}}
  - {titel: Mehr Protein, text: "Sriracha-Skyr auf 220 g Skyr verdoppeln.", aenderung: {"Skyr natur": 110}}
tipps:
  - "TikTok-Trick: Reis und Lachs in der Schüssel mit dem Löffel zerdrücken und mischen – so schmeckt jeder Bissen nach allem."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
