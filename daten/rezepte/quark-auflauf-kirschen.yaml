id: quark-auflauf-kirschen
name: Quark-Auflauf mit Kirschen
hauptkategorie: fruehstueck-snacks
kategorien_manuell: [Meal Prep]
mahlzeit: Frühstück
geschmack: süß
kueche: Deutsch
inspiration: null
schwierigkeit: leicht
zeit: {vorbereitung: 10, kochen: 35, wartezeit: 15}
ausstattung: [Backofen, "Auflaufform 20 × 20 cm", Schneebesen, Sieb]
zutaten:
  - gruppe: Quarkmasse
  - {id: quark, zutat: Magerquark, g: 400, hinweis: "⅘ Becher (500 g)"}
  - {id: eier, zutat: Ei Gr. M ohne Schale, name: Eier, g: 120, anzeige: "2 Eier Gr. M"}
  - {id: griess, zutat: Weichweizengrieß, name: Grieß, g: 65}
  - {id: whey, zutat: Whey Protein Vanille, g: 30, anzeige: "1 Messlöffel"}
  - {id: erythrit, zutat: Erythrit, g: 20, anzeige: "2 EL"}
  - {id: backpulver, zutat: Backpulver, g: 4, anzeige: "1 TL"}
  - {id: zitrone, zutat: Zitronensaft, g: 10, anzeige: "2 TL"}
  - {id: butter, zutat: Butter, g: 21, anzeige: "2 EL", hinweis: "für die Form und obenauf"}
  - gruppe: Obst & Topping
  - {id: kirschen, zutat: Sauerkirschen Glas abgetropft, name: Sauerkirschen, g: 120, hinweis: "gut abgetropft"}
  - {id: mandeln, zutat: Mandeln gehobelt, name: gehobelte Mandeln, g: 30, anzeige: "3 EL"}
mise_en_place:
  - "Backofen auf 180 °C Ober-/Unterhitze (160 °C Umluft) vorheizen, Rost auf die mittlere Schiene."
  - "Auflaufform mit einem Drittel von {butter} ausfetten, den Rest in kleine Flöckchen schneiden."
  - "{kirschen} in einem Sieb mindestens 5 Minuten abtropfen lassen (Saft anderweitig verwenden)."
schritte:
  - titel: Masse rühren
    text: "{quark}, {eier}, {griess}, {whey}, {erythrit}, {backpulver} und {zitrone} in einer Schüssel mit dem Schneebesen 1 Minute zu einer glatten Masse rühren. 5 Minuten stehen lassen, damit der Grieß quillt."
    timer_min: 5
  - titel: Schichten
    text: "Masse in die Form geben, glatt streichen und die Kirschen gleichmäßig darauf verteilen, leicht eindrücken. {mandeln} darüberstreuen und die Butterflöckchen darauf verteilen."
    timer_min: null
  - titel: Backen
    text: "Auf mittlerer Schiene bei 180 °C Ober-/Unterhitze (160 °C Umluft) 30–35 Minuten backen. Fertig, wenn die Oberfläche goldgelb ist, die Mandeln gebräunt sind und die Mitte beim leichten Rütteln an der Form nur noch minimal wackelt."
    timer_min: 35
  - titel: Ruhen lassen
    text: "Form herausnehmen und den Auflauf 15 Minuten ruhen lassen. Er sinkt etwas ein und wird schnittfest; frisch aus dem Ofen ist er innen noch cremig."
    timer_min: 15
zeitablauf:
  - "Während der Ofen vorheizt: Kirschen abtropfen lassen und die Masse rühren; der Grieß quillt in der Zeit."
fehler:
  - "**Auflauf wässrig:** Kirschen nicht abgetropft. Lösung: mindestens 5 Minuten im Sieb lassen, notfalls mit Küchenpapier abtupfen."
  - "**Reißt und wird trocken:** zu heiß oder zu lange gebacken. Lösung: bei 180 °C O/U bleiben und rausnehmen, wenn die Mitte nur noch leicht wackelt."
  - "**Grießig im Biss:** Grieß nicht gequollen. Lösung: die 5 Minuten Quellzeit einhalten."
anrichten: "Auflauf halbieren: eine Hälfte ({portion_g}) pro Portion, warm oder kalt. Für Meal Prep jede Hälfte in eine Box."
aufbewahrung:
  kuehlschrank_tage: 3
  einfrierbar: true
  einfrieren_monate: 1
  aufwaermen: "Kalt essen oder 1–1½ Minuten bei 600 W in der Mikrowelle."
varianten:
  - {titel: Mit Beeren, text: "150 g TK-Beerenmischung gefroren statt Kirschen.", aenderung: {"Sauerkirschen Glas abgetropft": -120, "Beerenmischung TK": 150}}
  - {titel: Mehr Protein, text: "Zusätzlich 150 g Skyr in die Masse rühren, 5 Minuten länger backen.", aenderung: {"Skyr natur": 150}}
  - {titel: Weniger kcal, text: "Mandeln weglassen.", aenderung: {"Mandeln gehobelt": -30}}
tipps:
  - "Abgeriebene Schale einer halben Bio-Zitrone in der Masse gibt Käsekuchen-Aroma."
  - "Kalt aus dem Kühlschrank schmeckt er wie Käsekuchen ohne Boden."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
