id: rindergulasch
name: Rindergulasch mit Salzkartoffeln
hauptkategorie: meal-prep
kategorien_manuell: [Meal Prep]
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Deutsch
inspiration: null
schwierigkeit: mittel
zeit: {vorbereitung: 15, kochen: 105, wartezeit: 0}
ausstattung: ["Bräter oder schwerer Topf ca. 3 l mit Deckel", "Topf ca. 2 l"]
zutaten:
  - gruppe: Gulasch
  - {id: rind, zutat: Rindergulasch roh, name: Rindergulasch, g: 510, hinweis: "aus der Schulter, in 3 cm Würfeln"}
  - {id: oel, zutat: Rapsöl, g: 25, anzeige: "2½ EL"}
  - {id: zwiebeln, zutat: Zwiebel, name: Zwiebeln, g: 250, anzeige: "3 Zwiebeln"}
  - {id: knoblauch, zutat: Knoblauch, g: 6, anzeige: "2 Zehen"}
  - {id: tomatenmark, zutat: Tomatenmark, g: 30, anzeige: "2 EL"}
  - {id: paprika, zutat: Paprikapulver edelsüß, name: Paprikapulver, g: 10, anzeige: "1½ EL"}
  - {id: kreuzkuemmel, zutat: Kreuzkümmel gemahlen, name: Kreuzkümmel, g: 1, anzeige: "½ TL"}
  - {id: bruehe, zutat: Gemüsebrühe zubereitet, name: Gemüsebrühe, g: 400, hinweis: "400 ml"}
  - {id: staerke, zutat: Speisestärke, g: 10, anzeige: "2 TL"}
  - {id: salz_g, zutat: Salz, g: 2, anzeige: "⅓ TL"}
  - {id: pfeffer, zutat: Pfeffer schwarz gemahlen, name: Pfeffer, g: 1, anzeige: "2 Prisen"}
  - gruppe: Salzkartoffeln
  - {id: kartoffeln, zutat: Kartoffeln festkochend roh, name: Kartoffeln, g: 400, hinweis: "geschält gewogen"}
  - {id: salz_wasser, zutat: Salz, name: Salz fürs Kochwasser, g: 10, anzeige: "2 TL", nicht_mitgerechnet: true}
mise_en_place:
  - "{rind} trocken tupfen; zu große Stücke auf 3 cm schneiden."
  - "{zwiebeln} halbieren und in 5 mm Streifen schneiden. {knoblauch} fein hacken."
  - "{staerke} mit 3 EL kaltem Wasser glatt rühren."
schritte:
  - titel: Fleisch anbraten
    text: "{oel} im Bräter auf Stufe 8 von 9 erhitzen, bis es schimmert (ca. 3 min). Fleisch in 2 Portionen jeweils 4 Minuten rundum kräftig anbraten, bis es braune Krusten hat. Nicht zu viel auf einmal, sonst kocht es im eigenen Saft. Herausnehmen."
    timer_min: 8
  - titel: Zwiebeln schmoren
    text: "Auf Stufe 5 von 9 zurückschalten, Zwiebeln in den Bräter geben und 8 Minuten unter Rühren goldbraun schmoren. Knoblauch, {tomatenmark}, {paprika} und {kreuzkuemmel} dazugeben und 1 Minute anrösten, bis es duftet (Paprika nicht verbrennen lassen, sonst wird er bitter)."
    timer_min: 9
  - titel: Schmoren
    text: "Fleisch samt Saft zurückgeben, mit {bruehe} ablöschen, den Bratensatz lösen, {salz_g} und {pfeffer} dazu. Aufkochen, dann auf Stufe 2 von 9 zurückschalten und zugedeckt 80–90 Minuten leise schmoren, alle 20 Minuten umrühren. Garprobe: Ein Fleischwürfel lässt sich mit der Gabel leicht zerdrücken."
    timer_min: 90
  - titel: Kartoffeln kochen
    text: "{kartoffeln} vierteln, im Topf knapp mit Wasser bedecken, {salz_wasser} dazu, auf Stufe 9 von 9 aufkochen und auf Stufe 5 von 9 18–20 Minuten kochen, bis ein Messer leicht hineingleitet. Abgießen und 1 Minute ausdampfen lassen."
    timer_min: 20
  - titel: Binden
    text: "Angerührte Stärke in das Gulasch rühren und 2 Minuten auf Stufe 4 von 9 köcheln, bis die Sauce sämig glänzt. Abschmecken."
    timer_min: 2
zeitablauf:
  - "Die Kartoffeln 25 Minuten vor Ende der Schmorzeit aufsetzen."
  - "Gulasch schmeckt am zweiten Tag noch besser: ideal für den Meal-Prep-Tag."
fehler:
  - "**Fleisch zäh:** zu kurz geschmort oder zu mageres Teilstück. Lösung: Schulter verwenden und bis die Gabelprobe klappt; lieber 15 Minuten länger."
  - "**Sauce bitter:** Paprikapulver verbrannt. Lösung: nur 1 Minute anrösten und sofort ablöschen."
  - "**Fleisch grau statt braun:** Topf überfüllt. Lösung: in 2 Portionen anbraten."
anrichten: "Pro Teller die Hälfte des Gulaschs und die Hälfte der Kartoffeln: {portion_g} pro Portion. Für Meal Prep Gulasch und Kartoffeln nebeneinander in eine Box."
aufbewahrung:
  kuehlschrank_tage: 4
  einfrierbar: true
  einfrieren_monate: 3
  aufwaermen: "Im Topf auf Stufe 4 von 9 mit 2 EL Wasser 5–6 Minuten oder Mikrowelle 600 W, 3 Minuten abgedeckt, nach der Hälfte umrühren."
  separat: "Gulasch innerhalb von 1 Stunde abkühlen und kühlen."
varianten:
  - {titel: Mit Nudeln, text: "150 g Hartweizennudeln statt Kartoffeln.", aenderung: {"Kartoffeln festkochend roh": -400, "Hartweizennudeln ungekocht": 150}}
  - {titel: Mit roter Paprika, text: "1 rote Paprika (150 g) in Streifen 20 Minuten vor Ende mitschmoren.", aenderung: {"Paprika rot": 150}}
  - {titel: Weniger kcal, text: "Kartoffeln auf 300 g reduzieren.", aenderung: {"Kartoffeln festkochend roh": -100}}
tipps:
  - "Ein Schuss Zitronensaft (1 TL) ganz zum Schluss hebt die Aromen."
  - "Nach dem Anbraten den Bratensatz gründlich lösen: Darin steckt der Geschmack."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
