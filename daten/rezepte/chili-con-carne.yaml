id: chili-con-carne
name: Chili con Carne mit Reis
hauptkategorie: meal-prep
kategorien_manuell: [Meal Prep]
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Mexikanisch
inspiration: null
schwierigkeit: leicht
zeit: {vorbereitung: 10, kochen: 40, wartezeit: 0}
ausstattung: ["Topf ca. 3 l mit Deckel", "Topf ca. 2 l mit Deckel", Sieb]
zutaten:
  - gruppe: Chili
  - {id: hack, zutat: Rinderhackfleisch 5 % Fett roh, name: Rinderhackfleisch (5 % Fett), g: 350}
  - {id: oel, zutat: Rapsöl, g: 8, anzeige: "2 TL"}
  - {id: zwiebel, zutat: Zwiebel, g: 80, anzeige: "1 Zwiebel"}
  - {id: knoblauch, zutat: Knoblauch, g: 6, anzeige: "2 Zehen"}
  - {id: paprika, zutat: Paprika rot, name: rote Paprika, g: 150, anzeige: "1 Paprika"}
  - {id: tomatenmark, zutat: Tomatenmark, g: 30, anzeige: "2 EL"}
  - {id: kreuzkuemmel, zutat: Kreuzkümmel gemahlen, name: Kreuzkümmel, g: 3, anzeige: "1½ TL"}
  - {id: paprikapulver, zutat: Paprikapulver edelsüß, name: Paprikapulver, g: 5, anzeige: "2 TL"}
  - {id: chili, zutat: Chiliflocken, g: 1, anzeige: "2 Prisen", hinweis: "nach Schärfewunsch bis 1 TL"}
  - {id: oregano, zutat: Oregano getrocknet, name: Oregano, g: 1, anzeige: "1 TL"}
  - {id: tomaten, zutat: Gehackte Tomaten Dose, name: gehackte Tomaten, g: 400, anzeige: "1 Dose"}
  - {id: bruehe, zutat: Gemüsebrühe zubereitet, name: Gemüsebrühe, g: 150, hinweis: "150 ml"}
  - {id: bohnen, zutat: Kidneybohnen abgetropft, name: Kidneybohnen, g: 250, anzeige: "1 Dose", hinweis: "abgetropft und abgespült"}
  - {id: mais, zutat: Mais abgetropft, name: Mais, g: 140, anzeige: "½ Dose"}
  - {id: schoko, zutat: Zartbitterschokolade 70 %, name: Zartbitterschokolade, g: 5, anzeige: "1 Rippchen", hinweis: "Geheimzutat"}
  - {id: salz, zutat: Salz, g: 2, anzeige: "⅓ TL"}
  - gruppe: Reis
  - {id: reis, zutat: Basmatireis ungekocht, name: Basmatireis, g: 100}
mise_en_place:
  - "{zwiebel} und {paprika} in 1 cm Würfel schneiden. {knoblauch} hacken."
  - "{bohnen} und {mais} in einem Sieb abspülen und abtropfen lassen. {reis} waschen."
schritte:
  - titel: Hack anbraten
    text: "{oel} im großen Topf auf Stufe 8 von 9 erhitzen. {hack} 2 Minuten anbraten, dann zerkrümeln und weitere 4 Minuten braten, bis es braun und krümelig ist."
    timer_min: 6
  - titel: Gemüse und Gewürze
    text: "Auf Stufe 6 von 9 schalten. Zwiebel, Paprika und Knoblauch 3 Minuten mitbraten. {tomatenmark}, {kreuzkuemmel}, {paprikapulver}, {chili} und {oregano} dazugeben und 1 Minute anrösten, bis es duftet."
    timer_min: 4
  - titel: Köcheln
    text: "{tomaten} und {bruehe} angießen, {salz} dazu, aufkochen und auf Stufe 3 von 9 mit schräg aufgelegtem Deckel 20 Minuten köcheln, gelegentlich umrühren. Bohnen, Mais und {schoko} unterrühren und weitere 5 Minuten köcheln. Garprobe: Das Hack ist durchgegart (72 °C Kerntemperatur ist nach dieser Zeit sicher erreicht), die Sauce sämig."
    timer_min: 25
  - titel: Reis kochen
    text: "Nach 10 Minuten Köchelzeit den Reis mit 180 ml Wasser im kleinen Topf mit Deckel auf Stufe 9 von 9 aufkochen, auf Stufe 2 von 9 12 Minuten quellen und 5 Minuten ruhen lassen."
    timer_min: 12
zeitablauf:
  - "Während das Chili köchelt, den Reis kochen. Chili schmeckt am zweiten Tag besser: ideal für Meal Prep."
fehler:
  - "**Chili wässrig:** zu kurz gekocht. Lösung: ohne Deckel 5 Minuten länger köcheln."
  - "**Zu scharf:** Chiliflocken unterschätzt. Lösung: 1 EL Skyr pro Portion darauf (nicht mitgerechnet: ca. +10 kcal)."
  - "**Bohnen zerfallen:** zu früh dazugegeben. Lösung: erst die letzten 5 Minuten."
anrichten: "Pro Teller die Hälfte des Reises und die Hälfte des Chilis: {portion_g} pro Portion."
aufbewahrung:
  kuehlschrank_tage: 4
  einfrierbar: true
  einfrieren_monate: 3
  aufwaermen: "Im Topf auf Stufe 4 von 9 mit 2 EL Wasser 5 Minuten oder Mikrowelle 600 W, 3 Minuten abgedeckt, nach der Hälfte umrühren."
  separat: "Reis innerhalb von 1 Stunde abkühlen und kühlen."
varianten:
  - {titel: Mit Skyr-Topping, text: "Je 75 g Skyr als Sour-Cream-Ersatz.", aenderung: {"Skyr natur": 150}}
  - {titel: Mit Putenhack, text: "350 g Putenhack statt Rinderhack.", aenderung: {"Rinderhackfleisch 5 % Fett roh": -350, "Putenhackfleisch roh": 350}}
  - {titel: Ohne Reis, text: "Reis weglassen und mit 30 g Reibekäse light überbacken (kalorienärmer).", aenderung: {"Basmatireis ungekocht": -100, "Reibekäse light": 30}}
tipps:
  - "Die Schokolade ist kein Fehler: Sie rundet die Säure der Tomaten ab und macht das Chili tiefer."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
