id: koefte-reis
name: Köfte mit Joghurt-Knoblauch-Sauce & Reis
hauptkategorie: meal-prep
kategorien_manuell: [Meal Prep]
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Türkisch & Orientalisch
inspiration: null
schwierigkeit: mittel
zeit: {vorbereitung: 15, kochen: 20, wartezeit: 0}
ausstattung: [Airfryer, "Topf ca. 2 l mit Deckel", Fleischthermometer]
zutaten:
  - gruppe: Köfte
  - {id: hack, zutat: Rinderhackfleisch 5 % Fett roh, name: Rinderhackfleisch (5 % Fett), g: 400}
  - {id: zwiebel, zutat: Zwiebel, g: 60, anzeige: "½ Zwiebel"}
  - {id: petersilie, zutat: Petersilie frisch, name: Petersilie, g: 10, anzeige: "2 EL gehackt"}
  - {id: panko, zutat: Paniermehl, g: 20, anzeige: "2 EL"}
  - {id: kreuzkuemmel, zutat: Kreuzkümmel gemahlen, name: Kreuzkümmel, g: 3, anzeige: "1½ TL"}
  - {id: paprika, zutat: Paprikapulver edelsüß, name: Paprikapulver, g: 3, anzeige: "1½ TL"}
  - {id: chili, zutat: Chiliflocken, g: 0.5, anzeige: "1 Prise"}
  - {id: salz_k, zutat: Salz, g: 3, anzeige: "½ TL"}
  - {id: pfeffer, zutat: Pfeffer schwarz gemahlen, name: Pfeffer, g: 1, anzeige: "2 Prisen"}
  - {id: oel, zutat: Rapsöl, g: 8, anzeige: "2 TL"}
  - gruppe: Joghurt-Knoblauch-Sauce
  - {id: skyr, zutat: Skyr natur, g: 200}
  - {id: knoblauch, zutat: Knoblauch, g: 3, anzeige: "1 Zehe"}
  - {id: zitrone, zutat: Zitronensaft, g: 5, anzeige: "1 TL"}
  - {id: salz_s, zutat: Salz, g: 1, anzeige: "2 Prisen"}
  - gruppe: Beilage
  - {id: reis, zutat: Basmatireis ungekocht, name: Basmatireis, g: 140}
  - {id: tomaten, zutat: Tomaten, g: 100, anzeige: "1 Tomate"}
mise_en_place:
  - "{zwiebel} sehr fein reiben oder hacken, {petersilie} fein hacken."
  - "Sauce: {skyr} mit fein geriebenem {knoblauch}, {zitrone} und {salz_s} verrühren."
  - "{reis} waschen. {tomaten} in Spalten schneiden."
schritte:
  - titel: Reis kochen
    text: "Reis mit 250 ml Wasser im Topf mit Deckel auf Stufe 9 von 9 aufkochen, auf Stufe 2 von 9 12 Minuten quellen und 5 Minuten ruhen lassen."
    timer_min: 12
  - titel: Köfte formen
    text: "{hack}, Zwiebel, Petersilie, {panko}, {kreuzkuemmel}, {paprika}, {chili}, {salz_k} und {pfeffer} 2 Minuten kräftig verkneten, bis die Masse klebrig wird. Mit nassen Händen 12 längliche Köfte formen (je ca. 40 g, 7 cm lang) und rundum dünn mit {oel} einpinseln."
    timer_min: null
  - titel: Köfte im Airfryer
    text: "Airfryer auf 200 °C 3 Minuten vorheizen. Köfte mit Abstand in den Korb legen (ggf. in 2 Durchgängen) und bei 200 °C 9–10 Minuten garen, nach 5 Minuten wenden. Fertig, wenn sie rundum gebräunt sind und 72 °C Kerntemperatur erreichen."
    timer_min: 10
zeitablauf:
  - "Reis aufsetzen, dann Köfte formen. Während der Reis ruht, sind die Köfte im Airfryer."
fehler:
  - "**Köfte zerfallen:** zu kurz geknetet. Lösung: 2 Minuten kneten, bis die Masse klebt."
  - "**Trocken:** zu lange gegart. Lösung: bei 72 °C raus; 5 % Hack verzeiht kein Übergaren."
  - "**Sauce zu scharf:** Knoblauch sehr frisch. Lösung: nur ½ Zehe nehmen und 10 Minuten durchziehen lassen."
anrichten: "Pro Teller die Hälfte des Reises, 6 Köfte, Tomatenspalten und die Hälfte der Sauce: {portion_g} pro Portion."
aufbewahrung:
  kuehlschrank_tage: 3
  einfrierbar: true
  einfrieren_monate: 3
  aufwaermen: "Köfte im Airfryer bei 180 °C 4 Minuten oder mit dem Reis 2½ Minuten bei 600 W; Sauce kalt dazu."
  separat: "Sauce und Tomaten getrennt, Reis innerhalb von 1 Stunde kühlen."
varianten:
  - {titel: Mit Putenhack, text: "400 g Putenhack statt Rinderhack.", aenderung: {"Rinderhackfleisch 5 % Fett roh": -400, "Putenhackfleisch roh": 400}}
  - {titel: Im Wrap, text: "Statt Reis mit Sauce und Tomaten in 2 Weizen-Tortillas.", aenderung: {"Basmatireis ungekocht": -140, "Weizen-Tortilla-Wraps": 124}}
  - {titel: Mit Feta, text: "40 g Feta über die Tomaten bröseln.", aenderung: {"Feta 45 % Fett i. Tr.": 40}}
tipps:
  - "Die Zwiebel fein reiben statt hacken: Die Köfte werden saftiger und halten besser."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
