id: butter-chicken
name: Butter Chicken mit Skyr & Reis
hauptkategorie: meal-prep
kategorien_manuell: [Meal Prep]
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Indisch
inspiration:
  quelle: "TikTok-/Instagram-Trend „High-Protein Butter Chicken“"
  link: null
  aenderungen: "Sahne (meist 200 ml) durch Skyr und Frischkäse light ersetzt, 30 g Butter statt eines ganzen Stücks für den typischen Buttergeschmack. Spart ca. 250 kcal pro Portion gegenüber dem Restaurant-Klassiker."
schwierigkeit: mittel
zeit: {vorbereitung: 10, kochen: 25, wartezeit: 30}
ausstattung: ["Pfanne 28 cm mit hohem Rand", "Topf ca. 2 l mit Deckel", Fleischthermometer, Pürierstab oder Standmixer]
zutaten:
  - gruppe: Marinade
  - {id: haehnchen, zutat: Hähnchenbrustfilet roh, name: Hähnchenbrustfilet, g: 400}
  - {id: skyr_m, zutat: Skyr natur, name: Skyr, g: 50, anzeige: "2 EL"}
  - {id: garam, zutat: Garam Masala, g: 3, anzeige: "1 TL"}
  - {id: paprika, zutat: Paprikapulver edelsüß, name: Paprikapulver, g: 3, anzeige: "1½ TL"}
  - {id: salz_m, zutat: Salz, g: 1.5, anzeige: "¼ TL"}
  - gruppe: Sauce
  - {id: oel, zutat: Rapsöl, g: 10, anzeige: "1 EL"}
  - {id: butter, zutat: Butter, g: 30, anzeige: "3 EL"}
  - {id: zwiebel, zutat: Zwiebel, g: 80, anzeige: "1 Zwiebel"}
  - {id: knoblauch, zutat: Knoblauch, g: 9, anzeige: "3 Zehen"}
  - {id: ingwer, zutat: Ingwer frisch, name: Ingwer, g: 10, anzeige: "2 cm Stück"}
  - {id: garam_s, zutat: Garam Masala, g: 3, anzeige: "1 TL"}
  - {id: curry, zutat: Currypulver, g: 3, anzeige: "1 TL"}
  - {id: tomatenmark, zutat: Tomatenmark, g: 30, anzeige: "2 EL"}
  - {id: tomaten, zutat: Gehackte Tomaten Dose, name: gehackte Tomaten, g: 200, anzeige: "½ Dose"}
  - {id: frischkaese, zutat: Frischkäse light, g: 60, anzeige: "2 EL"}
  - {id: skyr_s, zutat: Skyr natur, name: Skyr, g: 115}
  - {id: salz_s, zutat: Salz, g: 1.5, anzeige: "¼ TL"}
  - {id: zitrone, zutat: Zitronensaft, g: 10, anzeige: "2 TL"}
  - gruppe: Reis
  - {id: reis, zutat: Basmatireis ungekocht, name: Basmatireis, g: 115}
mise_en_place:
  - "{haehnchen} in 3 cm Würfel schneiden und mit {skyr_m}, {garam}, {paprika} und {salz_m} mischen. Abgedeckt 30 Minuten (oder bis 12 Stunden) im Kühlschrank marinieren."
  - "{zwiebel} grob würfeln, {knoblauch} und {ingwer} fein reiben. {reis} waschen."
schritte:
  - titel: Reis kochen
    text: "Reis mit 205 ml Wasser im Topf mit Deckel auf Stufe 9 von 9 aufkochen, auf Stufe 2 von 9 12 Minuten quellen und 5 Minuten ruhen lassen."
    timer_min: 12
  - titel: Hähnchen anbraten
    text: "{oel} in der Pfanne auf Stufe 8 von 9 erhitzen. Hähnchen samt Marinade in einer Lage hineingeben, 3 Minuten nicht bewegen, dann wenden und 2 Minuten anbraten, bis es Röstspuren hat (innen noch nicht durch). Herausnehmen."
    timer_min: 5
  - titel: Sauce kochen
    text: "Auf Stufe 5 von 9 schalten, {butter} in der Pfanne schmelzen, Zwiebel 4 Minuten weich dünsten. Knoblauch, Ingwer, {garam_s}, {curry} und {tomatenmark} 1 Minute anrösten. {tomaten} und 100 ml Wasser dazu, 5 Minuten köcheln. Mit dem Pürierstab glatt pürieren."
    timer_min: 10
  - titel: Hähnchen fertig garen
    text: "Hähnchen zurück in die Sauce, auf Stufe 4 von 9 5–6 Minuten köcheln, bis es 74 °C Kerntemperatur erreicht."
    timer_min: 6
  - titel: Cremig machen
    text: "Vom Herd ziehen, 1 Minute abkühlen lassen. {frischkaese}, {skyr_s}, {salz_s} und {zitrone} einrühren, bis die Sauce cremig orange ist. Nicht mehr kochen, sonst flockt der Skyr."
    timer_min: null
zeitablauf:
  - "Während das Hähnchen mariniert: Reis waschen, Zwiebel und Gewürze vorbereiten. Reis aufsetzen, dann sofort mit dem Hähnchen beginnen."
fehler:
  - "**Sauce flockt:** Skyr in kochende Sauce gerührt. Lösung: vom Herd ziehen, 1 Minute warten, dann einrühren."
  - "**Sauce stückig:** nicht püriert. Lösung: mit dem Pürierstab 30 Sekunden pürieren, bevor das Hähnchen zurückkommt."
  - "**Fade:** Gewürze nicht angeröstet. Lösung: 1 Minute im Fett anrösten, erst dann Tomaten."
anrichten: "Pro Teller die Hälfte des Reises und die Hälfte des Butter Chickens: {portion_g} pro Portion. Für Meal Prep nebeneinander in eine Box."
aufbewahrung:
  kuehlschrank_tage: 3
  einfrierbar: true
  einfrieren_monate: 2
  aufwaermen: "Mikrowelle 600 W, 2½–3 Minuten abgedeckt, mit 1 EL Wasser über dem Reis; bei 50 % Leistung flockt die Sauce nicht."
  separat: "Reis innerhalb von 1 Stunde abkühlen und kühlen."
varianten:
  - {titel: Mit Pute, text: "400 g Putenbrust statt Hähnchen.", aenderung: {"Hähnchenbrustfilet roh": -400, "Putenbrustfilet roh": 400}}
  - {titel: Mit Kichererbsen, text: "120 g Kichererbsen mit dem Hähnchen in die Sauce.", aenderung: {"Kichererbsen abgetropft": 120}}
  - {titel: Weniger kcal, text: "Reis auf 80 g und Butter auf 10 g reduzieren.", aenderung: {"Basmatireis ungekocht": -35, "Butter": -20}}
tipps:
  - "Wer es länger marinieren lässt (über Nacht), bekommt zarteres und würzigeres Hähnchen."
  - "Eine Prise Zucker oder 1 TL Honig rundet die Tomatensäure ab (+16 kcal)."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
