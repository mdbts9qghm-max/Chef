id: doener-bowl
name: Döner-Bowl mit Hähnchen
hauptkategorie: high-protein
kategorien_manuell: []
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Türkisch & Orientalisch
inspiration:
  quelle: "TikTok-/Instagram-Trend „Döner Box / Döner Bowl zu Hause“"
  link: null
  aenderungen: "Frittierte Pommes durch Airfryer-Pommes mit 5 g Öl ersetzt, fettes Dönerfleisch durch marinierte Hähnchenoberkeule ohne Haut, Knoblauchsauce aus Skyr statt Mayonnaise. Spart ca. 350 kcal gegenüber einer Döner-Box vom Imbiss."
schwierigkeit: mittel
zeit: {vorbereitung: 15, kochen: 30, wartezeit: 30}
ausstattung: [Airfryer, "Pfanne 28 cm", Fleischthermometer]
zutaten:
  - gruppe: Döner-Hähnchen
  - {id: haehnchen, zutat: Hähnchenoberkeule ohne Haut roh, name: Hähnchenoberkeulen ohne Haut, g: 400, hinweis: "ausgelöst"}
  - {id: skyr_m, zutat: Skyr natur, name: Skyr, g: 50, anzeige: "2 EL"}
  - {id: paprika, zutat: Paprikapulver edelsüß, name: Paprikapulver, g: 4, anzeige: "2 TL"}
  - {id: kreuzkuemmel, zutat: Kreuzkümmel gemahlen, name: Kreuzkümmel, g: 2, anzeige: "1 TL"}
  - {id: oregano, zutat: Oregano getrocknet, name: Oregano, g: 1, anzeige: "1 TL"}
  - {id: knoblauch_m, zutat: Knoblauch, name: Knoblauch, g: 6, anzeige: "2 Zehen"}
  - {id: zitrone, zutat: Zitronensaft, g: 10, anzeige: "2 TL"}
  - {id: salz_m, zutat: Salz, g: 2.5, anzeige: "½ TL knapp"}
  - {id: oel_h, zutat: Rapsöl, g: 15, anzeige: "1½ EL"}
  - gruppe: Airfryer-Pommes
  - {id: kartoffeln, zutat: Kartoffeln festkochend roh, name: Kartoffeln, g: 420, hinweis: "geschält gewogen"}
  - {id: oel_p, zutat: Rapsöl, g: 5, anzeige: "1 TL"}
  - {id: salz_p, zutat: Salz, g: 1.5, anzeige: "¼ TL"}
  - gruppe: Knoblauchsauce & Salat
  - {id: skyr_s, zutat: Skyr natur, name: Skyr, g: 150}
  - {id: knoblauch_s, zutat: Knoblauch, name: Knoblauch, g: 3, anzeige: "1 Zehe"}
  - {id: salz_s, zutat: Salz, g: 0.5, anzeige: "1 Prise"}
  - {id: tomaten, zutat: Tomaten, g: 100, anzeige: "1 Tomate"}
  - {id: gurke, zutat: Salatgurke, g: 100, anzeige: "¼ Gurke"}
  - {id: zwiebel, zutat: Zwiebel, g: 40, anzeige: "½ kleine Zwiebel", hinweis: "am besten rot"}
  - {id: feta, zutat: Feta 45 % Fett i. Tr., name: Feta, g: 60}
  - {id: chili, zutat: Chiliflocken, g: 0.5, anzeige: "1 Prise"}
mise_en_place:
  - "{haehnchen} in 5 mm dünne Streifen schneiden. Mit {skyr_m}, {paprika}, {kreuzkuemmel}, {oregano}, fein geriebenem {knoblauch_m}, {zitrone} und {salz_m} mischen, 30 Minuten (oder über Nacht) im Kühlschrank marinieren."
  - "{kartoffeln} in 1 cm dicke Stifte schneiden, 10 Minuten in kaltem Wasser wässern, dann gründlich trocken tupfen und mit {oel_p} mischen."
  - "Sauce: {skyr_s} mit fein geriebenem {knoblauch_s} und {salz_s} verrühren. {tomaten} und {gurke} würfeln, {zwiebel} in feine Ringe. {feta} zerbröseln."
schritte:
  - titel: Pommes im Airfryer
    text: "Airfryer auf 200 °C 3 Minuten vorheizen. Pommes bei 200 °C 18–22 Minuten garen, alle 6 Minuten kräftig schütteln. Fertig, wenn sie goldbraun und knusprig sind. Mit {salz_p} bestreuen."
    timer_min: 22
  - titel: Hähnchen braten
    text: "Nach 10 Minuten Pommes-Zeit: {oel_h} in der Pfanne (28 cm) auf Stufe 8 von 9 stark erhitzen. Hähnchenstreifen in einer Lage hineingeben, 3 Minuten nicht bewegen, dann wenden und 4–5 Minuten weiterbraten, bis die Ränder dunkel und knusprig sind. Fertig bei 74 °C Kerntemperatur (Oberkeule darf auch 80 °C haben, sie bleibt saftig)."
    timer_min: 8
zeitablauf:
  - "Während das Hähnchen mariniert: Pommes schneiden, wässern und Sauce machen. Pommes in den Airfryer, nach 10 Minuten das Hähnchen braten."
fehler:
  - "**Pommes labberig:** nicht getrocknet oder Korb überfüllt. Lösung: gründlich abtupfen, notfalls in 2 Durchgängen."
  - "**Hähnchen ohne Röstaroma:** Pfanne nicht heiß. Lösung: Stufe 8, Streifen in einer Lage."
  - "**Sauce zu scharf:** frischer Knoblauch. Lösung: 10 Minuten ziehen lassen, das mildert ihn."
anrichten: "Pro Bowl die Hälfte der Pommes, darauf die Hälfte des Hähnchens, daneben Tomaten, Gurke, Zwiebeln und 30 g Feta, die Hälfte der Knoblauchsauce darüber und mit {chili} bestreuen: {portion_g} pro Portion."
aufbewahrung:
  kuehlschrank_tage: 2
  einfrierbar: false
  aufwaermen: "Hähnchen und Pommes im Airfryer bei 190 °C 4–5 Minuten; Sauce und Salat kalt dazu."
  separat: "Sauce und Salat getrennt lagern."
varianten:
  - {titel: Mit Reis statt Pommes, text: "130 g Basmatireis statt Kartoffeln und Öl.", aenderung: {"Kartoffeln festkochend roh": -420, "Rapsöl": -5, "Basmatireis ungekocht": 130}}
  - {titel: Mit Hähnchenbrust, text: "400 g Hähnchenbrust statt Oberkeule (magerer).", aenderung: {"Hähnchenoberkeule ohne Haut roh": -400, "Hähnchenbrustfilet roh": 400}}
  - {titel: Scharf, text: "1 EL Sriracha in die Knoblauchsauce.", aenderung: {"Sriracha": 15}}
tipps:
  - "Hähnchenoberkeule statt Brust: wird beim scharfen Anbraten saftig und schmeckt mehr nach Dönerspieß."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
