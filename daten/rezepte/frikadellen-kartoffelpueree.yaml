id: frikadellen-kartoffelpueree
name: Frikadellen mit Kartoffelpüree
hauptkategorie: meal-prep
kategorien_manuell: [Meal Prep]
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Deutsch
inspiration: null
schwierigkeit: mittel
zeit: {vorbereitung: 15, kochen: 25, wartezeit: 0}
ausstattung: ["Pfanne 28 cm", "Topf ca. 3 l", Kartoffelstampfer, Fleischthermometer]
zutaten:
  - gruppe: Frikadellen
  - {id: hack, zutat: Rinderhackfleisch 5 % Fett roh, name: Rinderhackfleisch (5 % Fett), g: 400}
  - {id: quark, zutat: Magerquark, g: 80, hinweis: "macht sie saftig"}
  - {id: ei, zutat: Ei Gr. M ohne Schale, name: Ei, g: 60, anzeige: "1 Ei Gr. M"}
  - {id: panko, zutat: Paniermehl, g: 30, anzeige: "3 EL"}
  - {id: zwiebel, zutat: Zwiebel, g: 80, anzeige: "1 Zwiebel"}
  - {id: senf, zutat: Senf mittelscharf, name: Senf, g: 15, anzeige: "1 EL"}
  - {id: paprika, zutat: Paprikapulver edelsüß, name: Paprikapulver, g: 2, anzeige: "1 TL"}
  - {id: salz_f, zutat: Salz, g: 3, anzeige: "½ TL"}
  - {id: pfeffer, zutat: Pfeffer schwarz gemahlen, name: Pfeffer, g: 1, anzeige: "2 Prisen"}
  - {id: oel, zutat: Rapsöl, g: 10, anzeige: "2 TL"}
  - gruppe: Kartoffelpüree
  - {id: kartoffeln, zutat: Kartoffeln festkochend roh, name: Kartoffeln, g: 500, hinweis: "geschält gewogen; mehligkochende werden noch cremiger"}
  - {id: salz_wasser, zutat: Salz, name: Salz fürs Kochwasser, g: 10, anzeige: "2 TL", nicht_mitgerechnet: true}
  - {id: milch, zutat: "Milch 1,5 % Fett", name: Milch, g: 150, hinweis: "150 ml, warm"}
  - {id: butter, zutat: Butter, g: 10, anzeige: "2 TL"}
  - {id: salz_p, zutat: Salz, g: 1.5, anzeige: "¼ TL"}
mise_en_place:
  - "{kartoffeln} schälen und in 3 cm große Stücke schneiden."
  - "{zwiebel} sehr fein würfeln (3 mm)."
  - "{milch} in einer Tasse bereitstellen."
schritte:
  - titel: Kartoffeln kochen
    text: "Kartoffeln im Topf mit kaltem Wasser knapp bedecken, {salz_wasser} dazugeben und auf Stufe 9 von 9 aufkochen. Auf Stufe 5 von 9 zurückschalten und 18–20 Minuten mit schräg aufgelegtem Deckel kochen, bis ein Messer ohne Widerstand hineingleitet."
    timer_min: 20
  - titel: Hackmasse
    text: "{hack}, {quark}, {ei}, {panko}, Zwiebelwürfel, {senf}, {paprika}, {salz_f} und {pfeffer} mit den Händen 1 Minute verkneten, bis die Masse gleichmäßig bindet. Mit nassen Händen 6 flache Frikadellen formen (je ca. 110 g, 2 cm dick, in der Mitte leicht eindrücken, damit sie sich nicht wölben)."
    timer_min: null
  - titel: Frikadellen braten
    text: "{oel} in der Pfanne (28 cm) auf Stufe 6 von 9 erhitzen (ca. 2 min). Frikadellen hineinlegen und 5 Minuten braten, bis die Unterseite tiefbraun ist, wenden und auf Stufe 5 von 9 weitere 5–6 Minuten braten. Fertig bei 72 °C Kerntemperatur in der Mitte; ohne Thermometer: Fleischsaft klar, innen nicht mehr rosa."
    timer_min: 11
  - titel: Püree stampfen
    text: "Kartoffeln abgießen und 1 Minute im offenen Topf auf der ausgeschalteten, noch warmen Herdplatte (Stufe 0) ausdampfen lassen. Warme Milch, {butter} und {salz_p} dazugeben und mit dem Stampfer zu einem glatten Püree stampfen (nicht mixen, sonst wird es kleistrig)."
    timer_min: null
zeitablauf:
  - "Kartoffeln zuerst aufsetzen. Während sie kochen: Hackmasse kneten, formen und braten. Die Milch in den letzten Minuten 40 Sekunden bei 600 W in der Mikrowelle erwärmen."
fehler:
  - "**Frikadellen fallen auseinander:** Masse zu kurz geknetet. Lösung: 1 Minute kneten, bis sie klebt und bindet."
  - "**Außen schwarz, innen roh:** zu heiß. Lösung: nach dem Anbraten auf Stufe 5 von 9 und auf 72 °C messen."
  - "**Püree zäh:** gemixt statt gestampft. Lösung: Stampfer oder Gabel benutzen."
anrichten: "Pro Teller 3 Frikadellen und die Hälfte des Pürees: {portion_g} pro Portion. Für Meal Prep Frikadellen und Püree nebeneinander in eine Box."
aufbewahrung:
  kuehlschrank_tage: 3
  einfrierbar: true
  einfrieren_monate: 3
  aufwaermen: "Mikrowelle 600 W, 2½–3 Minuten abgedeckt, Püree mit 2 EL Milch oder Wasser (nicht mitgerechnet) verrühren. Frikadellen schmecken auch kalt."
varianten:
  - {titel: Mit Putenhack, text: "400 g Putenhack statt Rinderhack.", aenderung: {"Rinderhackfleisch 5 % Fett roh": -400, "Putenhackfleisch roh": 400}}
  - {titel: Weniger kcal, text: "Kartoffeln auf 350 g reduzieren und Butter weglassen.", aenderung: {"Kartoffeln festkochend roh": -150, "Butter": -10}}
  - {titel: Als Burger-Patty, text: "Masse zu 4 Patties formen und mit 2 Burger-Brötchen statt Püree servieren.", aenderung: {"Kartoffeln festkochend roh": -500, "Milch 1,5 % Fett": -150, "Butter": -10, "Burger-Brötchen": 150}}
tipps:
  - "Eine Prise geriebene Muskatnuss im Püree (falls vorhanden) gibt den Klassiker-Geschmack."
  - "Der Magerquark ersetzt das eingeweichte Brötchen: Die Frikadellen werden saftig und bekommen extra Protein."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
