id: cookie-dough-protein-dip
name: Cookie-Dough-Protein-Dip mit Apfelspalten
hauptkategorie: fruehstueck-snacks
kategorien_manuell: []
mahlzeit: Snack
geschmack: süß
kueche: Amerikanisch
herkunft: {art: import, quelle: "import/cookie-dough-dip-1.png, -2.png (fiktiver Test-Post)", datum: 2026-10-25}
inspiration:
  quelle: "TikTok-Post „Protein Cookie Dough Dip“ (Test-Screenshot, fiktiv)"
  link: null
  aenderungen: "Griechischen Joghurt durch Skyr ersetzt und auf 300 g erhöht, Ahornsirup durch Erythrit, Schokotropfen von ca. 42 g auf 15 g Zartbitter 70 % und Erdnussbutter von 32 g auf 24 g reduziert. Spart gegenüber dem Original ca. 200 kcal pro Portion und bringt über 10 g Protein pro 100 kcal."
schwierigkeit: leicht
zeit: {vorbereitung: 7, kochen: 0, wartezeit: 0}
ausstattung: [Schüssel, Schneebesen oder Gabel, Schneidebrett]
zutaten:
  - gruppe: Dip
  - {id: skyr, zutat: Skyr natur, g: 300}
  - {id: whey, zutat: Whey Protein Vanille, g: 30, anzeige: "1 Messlöffel"}
  - {id: pb, zutat: Erdnussbutter 100 % Erdnüsse, name: Erdnussbutter, g: 24, anzeige: "1½ EL"}
  - {id: erythrit, zutat: Erythrit, g: 10, anzeige: "1 EL"}
  - {id: salz, zutat: Salz, g: 0.5, anzeige: "1 Prise"}
  - {id: schoko, zutat: Zartbitterschokolade 70 %, name: Zartbitterschokolade, g: 15, anzeige: "3 Rippchen", hinweis: "fein gehackt wie Schokotropfen"}
  - gruppe: Zum Dippen
  - {id: apfel, zutat: Apfel, g: 160, anzeige: "1 Apfel", hinweis: "säuerlich, z. B. Elstar; entkernt gewogen"}
mise_en_place:
  - "{schoko} mit einem großen Messer fein hacken (2–3 mm Stückchen); ein Viertel davon für oben beiseitelegen."
  - "{apfel} vierteln, entkernen und in 8 Spalten pro Apfel schneiden. Mit ein paar Tropfen Wasser beträufeln, wenn sie stehen bleiben."
schritte:
  - titel: Dip rühren
    text: "{skyr}, {whey}, {pb}, {erythrit} und {salz} in der Schüssel mit dem Schneebesen 1 Minute kräftig verrühren, bis die Masse glatt und hellbraun ist und keine Erdnussbutter-Schlieren mehr zu sehen sind. Sie soll dick wie Keksteig sein; ist sie zu fest, 1–2 EL Wasser unterrühren."
    timer_min: null
  - titel: Schokolade unterheben
    text: "Drei Viertel der gehackten {schoko:n} mit dem Löffel unterheben, nicht mehr rühren, damit die Stückchen sichtbar bleiben."
    timer_min: null
  - titel: Anrichten
    text: "Dip auf 2 kleine Schalen verteilen, glatt streichen und die restliche Schokolade darüberstreuen. Mit den Apfelspalten servieren."
    timer_min: null
zeitablauf:
  - "Während die Schokolade gehackt ist, Apfel schneiden; der Dip ist in 7 Minuten fertig."
fehler:
  - "**Dip zu flüssig:** sehr weicher Skyr oder zu viel Wasser. Lösung: 10 Minuten in den Kühlschrank stellen, das Whey bindet nach."
  - "**Schmeckt nach Eiweißpulver:** Salz vergessen. Lösung: Die Prise Salz macht den Keksteig-Geschmack, nicht weglassen."
  - "**Schokolade schmilzt in Schlieren:** in noch warmer Erdnussbutter verrührt. Lösung: Schokolade erst zum Schluss und kalt unterheben."
anrichten: "Pro Schale die Hälfte des Dips mit Schokostückchen, daneben 4 Apfelspalten: {portion_g} pro Portion."
aufbewahrung:
  kuehlschrank_tage: 2
  einfrierbar: false
  aufwaermen: "Nicht aufwärmen, gekühlt essen. Apfel erst frisch schneiden."
  separat: "Dip abgedeckt im Kühlschrank; die Schokolade obendrauf erst vor dem Essen."
varianten:
  - {titel: Mit Haferflocken, text: "2 EL zarte Haferflocken (20 g) unterrühren: noch mehr Keksteig-Biss.", aenderung: {"Haferflocken zart": 20}}
  - {titel: Schoko-Keksteig, text: "Whey Protein Schoko statt Vanille.", aenderung: {"Whey Protein Vanille": -30, "Whey Protein Schoko": 30}}
  - {titel: Mit Beeren statt Apfel, text: "200 g Beerenmischung (aufgetaut) statt Apfelspalten.", aenderung: {"Apfel": -160, "Beerenmischung TK": 200}}
tipps:
  - "Über Nacht im Kühlschrank wird der Dip fester und schmeckt noch mehr nach Keksteig; dann löffeln statt dippen."
  - "Ein paar Tropfen Vanillearoma (falls im Vorrat) verstärken den Cookie-Geschmack ohne kcal."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
