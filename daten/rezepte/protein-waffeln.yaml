id: protein-waffeln
name: Protein-Waffeln mit Kirschen & Vanille-Skyr
hauptkategorie: fruehstueck-snacks
kategorien_manuell: []
mahlzeit: Frühstück
geschmack: süß
kueche: Amerikanisch
inspiration: null
schwierigkeit: leicht
zeit: {vorbereitung: 7, kochen: 16, wartezeit: 0}
ausstattung: [Waffeleisen, Standmixer, "kleiner Topf ca. 1 l", Backpinsel]
zutaten:
  - gruppe: Teig
  - {id: hafer, zutat: Haferflocken zart, g: 70}
  - {id: quark, zutat: Magerquark, g: 200}
  - {id: eier, zutat: Ei Gr. M ohne Schale, name: Eier, g: 120, anzeige: "2 Eier Gr. M"}
  - {id: whey_teig, zutat: Whey Protein Vanille, name: Whey Protein Vanille, g: 20, anzeige: "⅔ Messlöffel"}
  - {id: milch, zutat: "Milch 1,5 % Fett", name: Milch, g: 80, hinweis: "80 ml"}
  - {id: backpulver, zutat: Backpulver, g: 6, anzeige: "1½ TL"}
  - {id: salz, zutat: Salz, g: 0.5, anzeige: "1 Prise"}
  - {id: oel, zutat: Rapsöl, g: 19, anzeige: "2 EL", hinweis: "halb in den Teig, halb fürs Waffeleisen"}
  - gruppe: Kirschen
  - {id: kirschen, zutat: Sauerkirschen Glas abgetropft, name: Sauerkirschen, g: 115, hinweis: "abgetropft, 4 EL Saft auffangen"}
  - {id: staerke, zutat: Speisestärke, g: 5, anzeige: "1 TL"}
  - gruppe: Vanille-Skyr
  - {id: skyr, zutat: Skyr natur, g: 200}
  - {id: whey_skyr, zutat: Whey Protein Vanille, name: Whey Protein Vanille, g: 10, anzeige: "1 gehäufter EL"}
  - {id: mandeln, zutat: Mandeln gehobelt, name: gehobelte Mandeln, g: 22, anzeige: "2 EL"}
mise_en_place:
  - "Waffeleisen auf mittlere Stufe vorheizen (bei Geräten mit Regler: Stufe 3 von 5), bis die Kontrollleuchte erlischt."
  - "{kirschen} in einem Sieb abtropfen lassen, dabei 4 EL (60 ml) Saft auffangen. {staerke} mit 2 EL vom kalten Saft glatt rühren."
schritte:
  - titel: Teig mixen
    text: "{hafer} im Standmixer 15 Sekunden fein mahlen. {quark}, {eier}, {whey_teig}, {milch}, die Hälfte von {oel:n}, {backpulver} und {salz} dazugeben und 20 Sekunden glatt mixen. Der Teig ist dick wie Quarkcreme. 3 Minuten quellen lassen."
    timer_min: 3
  - titel: Kirschkompott
    text: "Restlichen Kirschsaft im kleinen Topf auf Stufe 7 von 9 aufkochen, angerührte Stärke einrühren und 30 Sekunden unter Rühren kochen, bis der Saft glasig und dick wird. Kirschen unterheben, vom Herd ziehen."
    timer_min: 2
  - titel: Waffeln backen
    text: "Waffeleisen mit dem Pinsel dünn mit dem restlichen {oel:n} einstreichen. Pro Waffel ca. 4 EL Teig (110 g) in die Mitte geben, Deckel schließen und 3½–4 Minuten backen, bis kaum noch Dampf austritt und die Waffel goldbraun ist. Erst dann öffnen, sonst reißt sie. Ergibt 4 Waffeln. Vor jeder Waffel dünn nachfetten; insgesamt (Teig + Eisen) {oel}."
    timer_min: 4
  - titel: Vanille-Skyr
    text: "{skyr} mit {whey_skyr} und 1 EL Wasser glatt rühren. {mandeln} bereitstellen."
    timer_min: null
zeitablauf:
  - "Während der Teig quillt: Kirschkompott kochen."
  - "Während die Waffeln backen: Vanille-Skyr anrühren."
fehler:
  - "**Waffel klebt und reißt:** Eisen nicht heiß genug oder zu früh geöffnet. Lösung: Kontrollleuchte abwarten und erst öffnen, wenn kein Dampf mehr kommt."
  - "**Waffeln weich statt knusprig:** aufeinandergestapelt. Lösung: nebeneinander auf ein Gitter legen, dann bleiben sie außen kross."
  - "**Kompott flüssig:** Stärke nicht aufgekocht. Lösung: Stärke bindet erst beim Kochen, 30 Sekunden sprudeln lassen."
anrichten: "Pro Teller 2 Waffeln, darauf 105 g Vanille-Skyr, die Hälfte des Kirschkompotts und 11 g gehobelte Mandeln: {portion_g} pro Portion."
aufbewahrung:
  kuehlschrank_tage: 2
  einfrierbar: true
  einfrieren_monate: 2
  aufwaermen: "Im Toaster 1 Durchgang auf mittlerer Stufe, dann werden sie wieder knusprig. Gefroren: 2 Durchgänge."
  separat: "Waffeln, Kompott und Skyr getrennt lagern."
varianten:
  - {titel: Mehr Protein, text: "Vanille-Skyr auf 350 g erhöhen.", aenderung: {"Skyr natur": 150}}
  - {titel: Beeren statt Kirschen, text: "150 g TK-Beerenmischung kurz mit der Stärke aufkochen statt Sauerkirschen.", aenderung: {"Sauerkirschen Glas abgetropft": -115, "Beerenmischung TK": 150}}
  - {titel: Weniger kcal, text: "Mandeln weglassen und nur 3 Waffeln backen (Rest einfrieren).", aenderung: {"Mandeln gehobelt": -22}}
tipps:
  - "Eine Prise Zimt und etwas abgeriebene Zitronenschale im Teig: schmeckt nach Bäckerei-Waffel."
  - "Die Waffeln eignen sich als Vorrat: 4 Stück auf Vorrat backen, einfrieren und morgens in den Toaster."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
