id: protein-pancakes
name: Protein-Pancakes mit Heidelbeeren & Honig
hauptkategorie: fruehstueck-snacks
kategorien_manuell: []
mahlzeit: Frühstück
geschmack: süß
kueche: Amerikanisch
inspiration:
  quelle: "TikTok-/Instagram-Trend „Cottage Cheese / Protein Pancakes“"
  link: null
  aenderungen: "Mehl durch fein gemixte Haferflocken ersetzt, Buttermilch durch Magerquark und Eiklar, Zucker weggelassen (Süße aus Whey und Honig), 12 g Öl für die Pfanne (gibt knusprige Ränder)."
schwierigkeit: leicht
zeit: {vorbereitung: 5, kochen: 18, wartezeit: 0}
ausstattung: [Standmixer, "Pfanne 28 cm (beschichtet)", Pfannenwender, Mikrowelle]
zutaten:
  - gruppe: Teig
  - {id: hafer, zutat: Haferflocken zart, g: 85}
  - {id: quark, zutat: Magerquark, g: 250, hinweis: "½ Becher"}
  - {id: eier, zutat: Ei Gr. M ohne Schale, name: Eier, g: 180, anzeige: "3 Eier Gr. M"}
  - {id: eiklar, zutat: Eiklar flüssig, name: Eiklar, g: 40, hinweis: "aus der Flasche, 40 ml"}
  - {id: whey, zutat: Whey Protein Vanille, g: 30, anzeige: "1 Messlöffel"}
  - {id: milch, zutat: "Milch 1,5 % Fett", name: Milch, g: 50, hinweis: "50 ml"}
  - {id: backpulver, zutat: Backpulver, g: 6, anzeige: "1½ TL"}
  - {id: salz, zutat: Salz, g: 0.5, anzeige: "1 Prise"}
  - {id: oel, zutat: Rapsöl, g: 12, anzeige: "1 EL", hinweis: "zum Ausbacken"}
  - gruppe: Topping
  - {id: heidelbeeren, zutat: Heidelbeeren TK, g: 120}
  - {id: skyr, zutat: Skyr natur, g: 160}
  - {id: honig, zutat: Honig, g: 10, anzeige: "2 TL"}
mise_en_place:
  - "{heidelbeeren} in einer Schüssel 1½ Minuten bei 600 W in der Mikrowelle auftauen, bis sie weich sind und Saft gezogen haben."
  - "{oel} in einem Schälchen bereitstellen und ein Stück Küchenpapier daneben legen."
schritte:
  - titel: Teig mixen
    text: "{hafer} im Standmixer 15 Sekunden auf höchster Stufe zu feinem Mehl mahlen. {quark}, {eier}, {eiklar}, {whey}, {milch}, {backpulver} und {salz} dazugeben und 20 Sekunden mixen, bis ein glatter, dickflüssiger Teig entsteht. 2 Minuten stehen lassen, damit der Hafer quillt; der Teig soll langsam vom Löffel fließen."
    timer_min: 2
  - titel: Pfanne vorbereiten
    text: "Pfanne (28 cm) auf Stufe 6 von 9 ca. 2 Minuten vorheizen. Ein Drittel des Öls hineingeben und mit Küchenpapier dünn verteilen. Test: Ein Tropfen Teig soll sofort leise zischen und am Rand fest werden."
    timer_min: 2
  - titel: Ausbacken
    text: "Pro Pancake 2 EL Teig (ca. 55 g) in die Pfanne geben, 3–4 Stück gleichzeitig, 8 cm Durchmesser. 2 Minuten backen, bis sich auf der Oberfläche Bläschen bilden und der Rand matt wird, dann wenden und weitere 1–1½ Minuten backen, bis beide Seiten goldbraun sind. Auf Stufe 5 von 9 herunterschalten, wenn sie zu schnell bräunen. Pfanne vor jeder Runde mit etwas Öl auswischen. Ergibt ca. 14 Pancakes."
    timer_min: 4
  - titel: Topping
    text: "{skyr} glatt rühren. Pancakes auf 2 Teller stapeln, Skyr und die Heidelbeeren samt Saft darauf verteilen, mit {honig} beträufeln."
    timer_min: null
zeitablauf:
  - "Während der Teig quillt: Pfanne vorheizen und Heidelbeeren auftauen."
  - "Fertige Pancakes im Ofen bei 50 °C Ober-/Unterhitze (50 °C Umluft) auf einem Teller warmhalten, falls ihr zusammen essen wollt."
fehler:
  - "**Pancakes reißen beim Wenden:** zu früh gewendet oder zu groß. Lösung: erst wenden, wenn der Rand matt ist, und nicht größer als 8 cm backen."
  - "**Außen dunkel, innen roh:** Pfanne zu heiß. Lösung: Ceran auf Stufe 5–6 von 9; der Teig braucht Zeit, um durchzugaren."
  - "**Flach und gummiartig:** Teig zu lange gemixt oder Backpulver vergessen. Lösung: nur bis glatt mixen und die 2 Minuten Ruhezeit einhalten."
anrichten: "Pro Teller 7 Pancakes, darauf 80 g Skyr, 60 g Heidelbeeren mit Saft und 1 TL Honig: {portion_g} pro Portion."
aufbewahrung:
  kuehlschrank_tage: 2
  einfrierbar: true
  einfrieren_monate: 2
  aufwaermen: "Toaster auf mittlerer Stufe 1 Durchgang oder Mikrowelle 600 W, 40–60 Sekunden. Gefroren direkt in den Toaster."
  separat: "Pancakes ohne Topping lagern, Skyr und Beeren erst beim Essen dazugeben."
varianten:
  - {titel: Schoko-Pancakes, text: "Whey Protein Schoko statt Vanille, dazu 10 g Backkakao in den Teig.", aenderung: {"Whey Protein Vanille": -30, "Whey Protein Schoko": 30, "Kakaopulver stark entölt": 10}}
  - {titel: Bananen-Pancakes, text: "1 kleine Banane (100 g) in Scheiben auf die rohe Teigseite legen, bevor gewendet wird; Honig weglassen.", aenderung: {"Banane geschält": 100, "Honig": -10}}
  - {titel: Mehr Protein, text: "Skyr-Topping auf 320 g verdoppeln.", aenderung: {"Skyr natur": 160}}
tipps:
  - "Eine Prise Zimt und ein paar Tropfen Zitronensaft im Topping lassen die Heidelbeeren intensiver schmecken."
  - "Je kleiner die Pancakes, desto fluffiger: Der Hafer-Quark-Teig ist schwerer als klassischer Mehlteig."
gargewicht_g: null
