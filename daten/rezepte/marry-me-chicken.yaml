id: marry-me-chicken
name: Marry Me Chicken mit Reis
hauptkategorie: high-protein
kategorien_manuell: [Meal Prep]
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Amerikanisch
inspiration:
  quelle: "TikTok-/Instagram-Trend „Marry Me Chicken“"
  link: null
  aenderungen: "Schlagsahne (meist 200 ml) durch Milch 1,5 % und Frischkäse light ersetzt, Butter weggelassen und Öl auf 10 g reduziert. Spart gegenüber einer Version mit 200 g Schlagsahne und 20 g Butter ca. 275 kcal pro Portion."
schwierigkeit: mittel
zeit: {vorbereitung: 10, kochen: 25, wartezeit: 0}
ausstattung: ["Pfanne 28 cm mit Deckel", "Topf ca. 2 l mit Deckel", Fleischthermometer]
zutaten:
  - gruppe: Reis
  - {id: reis, zutat: Basmatireis ungekocht, name: Basmatireis, g: 150, hinweis: "ungekocht"}
  - {id: salz_reis, zutat: Salz, g: 1.5, anzeige: "¼ TL", hinweis: "für den Reis"}
  - gruppe: Hähnchen
  - {id: haehnchen, zutat: Hähnchenbrustfilet roh, name: Hähnchenbrustfilets, g: 400, anzeige: "2 Hähnchenbrustfilets", hinweis: "roh"}
