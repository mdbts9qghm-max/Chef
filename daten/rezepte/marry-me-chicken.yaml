  - {id: pfeffer, zutat: Pfeffer schwarz gemahlen, name: Pfeffer, g: 0.5, anzeige: "1 Prise", hinweis: "schwarz, gemahlen"}
  - {id: oel_h, zutat: Olivenöl, g: 5, anzeige: "1 TL"}
  - gruppe: Sauce
  - {id: oel_s, zutat: Olivenöl, g: 5, anzeige: "1 TL"}
  - {id: zwiebel, zutat: Zwiebel, g: 60, anzeige: "½ mittelgroße Zwiebel"}
  - {id: knoblauch, zutat: Knoblauch, g: 9, anzeige: "3 Zehen"}
