id: quarkcreme-banane-zimt
name: Quarkcreme mit Banane & Zimt
hauptkategorie: fruehstueck-snacks
kategorien_manuell: []
mahlzeit: Snack
geschmack: süß
kueche: Deutsch
inspiration: null
schwierigkeit: leicht
zeit: {vorbereitung: 5, kochen: 2, wartezeit: 0}
ausstattung: ["Pfanne 24 cm", Schneebesen, "2 Schalen"]
zutaten:
  - {id: quark, zutat: Magerquark, g: 300}
  - {id: milch, zutat: "Milch 1,5 % Fett", name: Milch, g: 50, hinweis: "50 ml"}
  - {id: whey, zutat: Whey Protein Vanille, g: 15, anzeige: "½ Messlöffel"}
  - {id: banane, zutat: Banane geschält, name: Banane, g: 100, anzeige: "1 kleine Banane"}
  - {id: zimt, zutat: Zimt gemahlen, name: Zimt, g: 2, anzeige: "1 TL"}
  - {id: mandeln, zutat: Mandeln gehobelt, name: gehobelte Mandeln, g: 10, anzeige: "1 EL"}
mise_en_place:
  - "{banane} schälen und in 5 mm Scheiben schneiden."
schritte:
  - titel: Mandeln rösten
    text: "{mandeln} ohne Fett in der Pfanne (24 cm) auf Stufe 6 von 9 1½–2 Minuten goldbraun rösten, sofort auf einen Teller geben."
    timer_min: 2
  - titel: Creme aufschlagen
    text: "{quark}, {milch}, {whey} und die Hälfte von {zimt} mit dem Schneebesen 1 Minute luftig aufschlagen, bis die Creme hell und cremig ist."
    timer_min: null
  - titel: Anrichten
    text: "Creme auf 2 Schalen verteilen, Bananenscheiben darauf legen, mit dem restlichen Zimt und den gerösteten Mandeln bestreuen."
    timer_min: null
zeitablauf:
  - "Während die Mandeln rösten: Creme aufschlagen."
fehler:
  - "**Creme fest und stumpf:** zu kurz geschlagen. Lösung: wirklich 1 Minute schlagen, dann wird Magerquark luftig."
  - "**Banane braun:** zu früh geschnitten. Lösung: erst kurz vor dem Servieren schneiden."
anrichten: "Pro Schale {portion_g}: Quarkcreme mit Banane, Zimt und 5 g Mandeln."
aufbewahrung:
  kuehlschrank_tage: 1
  einfrierbar: false
  aufwaermen: "Nicht aufwärmen, kalt essen."
  separat: "Banane erst beim Essen schneiden."
varianten:
  - {titel: Mit Beeren, text: "150 g Beerenmischung statt Banane.", aenderung: {"Banane geschält": -100, "Beerenmischung TK": 150}}
  - {titel: Mit Erdnussbutter, text: "10 g Erdnussbutter darüberträufeln.", aenderung: {"Erdnussbutter 100 % Erdnüsse": 10}}
tipps:
  - "Auch als Nachtisch nach dem Abendessen: noch 10 Minuten ins Gefrierfach, dann schmeckt sie wie Frozen Yogurt."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
