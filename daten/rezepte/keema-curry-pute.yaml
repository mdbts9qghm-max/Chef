id: keema-curry-pute
name: Keema-Curry mit Putenhack & Kichererbsen
hauptkategorie: meal-prep
kategorien_manuell: [Meal Prep]
mahlzeit: Mittag/Abend
geschmack: herzhaft
kueche: Indisch
inspiration: null
schwierigkeit: leicht
zeit: {vorbereitung: 10, kochen: 30, wartezeit: 0}
ausstattung: ["Pfanne 28 cm mit hohem Rand", "Topf ca. 2 l mit Deckel", Sieb]
zutaten:
  - gruppe: Keema
  - {id: hack, zutat: Putenhackfleisch roh, name: Putenhackfleisch, g: 400}
  - {id: oel, zutat: Rapsöl, g: 12, anzeige: "1 EL"}
  - {id: zwiebel, zutat: Zwiebel, g: 100, anzeige: "1 große Zwiebel"}
  - {id: knoblauch, zutat: Knoblauch, g: 9, anzeige: "3 Zehen"}
  - {id: ingwer, zutat: Ingwer frisch, name: Ingwer, g: 10, anzeige: "2 cm Stück"}
  - {id: garam, zutat: Garam Masala, g: 6, anzeige: "2 TL"}
  - {id: curry, zutat: Currypulver, g: 4, anzeige: "1½ TL"}
  - {id: kreuzkuemmel, zutat: Kreuzkümmel gemahlen, name: Kreuzkümmel, g: 2, anzeige: "1 TL"}
  - {id: tomaten, zutat: Gehackte Tomaten Dose, name: gehackte Tomaten, g: 400, anzeige: "1 Dose"}
  - {id: kichererbsen, zutat: Kichererbsen abgetropft, name: Kichererbsen, g: 240, anzeige: "1 Dose", hinweis: "abgetropft und abgespült"}
  - {id: salz, zutat: Salz, g: 3, anzeige: "½ TL"}
  - gruppe: Beilage
  - {id: reis, zutat: Basmatireis ungekocht, name: Basmatireis, g: 90}
  - {id: skyr, zutat: Skyr natur, g: 110, hinweis: "als kühler Klecks"}
mise_en_place:
  - "{zwiebel} fein würfeln, {knoblauch} und {ingwer} fein reiben."
  - "{kichererbsen} abspülen und abtropfen lassen. {reis} waschen."
schritte:
  - titel: Zwiebeln bräunen
    text: "{oel} in der Pfanne auf Stufe 6 von 9 erhitzen und die Zwiebel 6 Minuten goldbraun braten; das gibt dem Keema die Tiefe."
    timer_min: 6
  - titel: Hack und Gewürze
    text: "Auf Stufe 8 von 9 schalten, {hack} dazugeben und 5 Minuten krümelig braten. Knoblauch, Ingwer, {garam}, {curry} und {kreuzkuemmel} 1 Minute mitrösten."
    timer_min: 6
  - titel: Köcheln
    text: "{tomaten}, Kichererbsen, {salz} und 100 ml Wasser dazugeben, aufkochen und auf Stufe 3 von 9 15 Minuten köcheln, bis das Keema dick und saftig ist. Garprobe: Hack ist vollständig durch, 72 °C Kerntemperatur."
    timer_min: 15
  - titel: Reis kochen
    text: "Während das Keema köchelt: Reis mit 160 ml Wasser im Topf mit Deckel auf Stufe 9 von 9 aufkochen, auf Stufe 2 von 9 12 Minuten quellen und 5 Minuten ruhen lassen."
    timer_min: 12
zeitablauf:
  - "Den Reis aufsetzen, sobald das Keema köchelt."
fehler:
  - "**Keema schmeckt flach:** Zwiebeln nicht gebräunt. Lösung: wirklich 6 Minuten goldbraun braten."
  - "**Zu trocken:** zu lange ohne Flüssigkeit. Lösung: 2–3 EL Wasser nachgießen."
  - "**Gewürze bitter:** zu heiß geröstet. Lösung: nur 1 Minute, dann sofort Tomaten."
anrichten: "Pro Teller die Hälfte des Reises, die Hälfte des Keemas und die Hälfte von {skyr} obenauf: {portion_g} pro Portion."
aufbewahrung:
  kuehlschrank_tage: 4
  einfrierbar: true
  einfrieren_monate: 3
  aufwaermen: "Mikrowelle 600 W, 3 Minuten abgedeckt, nach der Hälfte umrühren; Skyr kalt dazu."
  separat: "Skyr getrennt, Reis innerhalb von 1 Stunde kühlen."
varianten:
  - {titel: Mit Rinderhack, text: "400 g Rinderhack 5 % statt Pute.", aenderung: {"Putenhackfleisch roh": -400, "Rinderhackfleisch 5 % Fett roh": 400}}
  - {titel: Mit Spinat, text: "100 g Babyspinat die letzten 2 Minuten unterheben (Saag Keema).", aenderung: {"Babyspinat": 100}}
  - {titel: Mit Fladenbrot-Ersatz, text: "Statt Reis je 1 Weizen-Tortilla in der Pfanne anrösten.", aenderung: {"Basmatireis ungekocht": -90, "Weizen-Tortilla-Wraps": 124}}
tipps:
  - "Ein Spritzer Zitronensaft vor dem Servieren macht das Keema frischer."
gargewicht_g: null
bewertung: {sterne: null, kommentar: null, datum: null}
