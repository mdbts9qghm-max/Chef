# Persönliches Profil – Grundlage für alle Berechnungen und Prüfungen.
# Änderungen hier wirken auf Prüfungen, Wochenpläne und Einkaufslisten.
# Nach jeder Änderung: python3 tools/pruefen.py && python3 tools/generieren.py

person:
  ziel: Body Recomposition (Muskelaufbau bei gleichzeitigem Fettabbau)
  gewicht_kg: 82
  tracking: MacroFactor (iPhone)

# Tagesziele aus MacroFactor
tagesziele:
  stand: 2026-10-20
  kcal: 2275
  protein_g: 149
  fett_g: 101
  kh_g: 191

haushalt:
  personen: 2
  portionen_pro_rezept: 2       # Nährwerte gelten pro Portion = meine Portion

mahlzeiten: [Frühstück, Mittag, Abend]   # Snacks nur zum Auffüllen

# Harte Vorlieben (SPEC 2.1)
vorlieben:
  fruehstueck_geschmack: süß    # herzhaft nur auf ausdrücklichen Wunsch
  fruehstueck_zucker_max_g: 20  # Richtwert pro Frühstücksportion (Warnung)
  gemuese: wenig                # nie Hauptbestandteil; Zwiebel, Knoblauch, Tomate, etwas Paprika okay
  alltagstauglich: true         # normale deutsche Supermärkte; Exotisches nur lange haltbar und mehrfach genutzt
  geschmack_zaehlt: true

# Korridore pro Portion (SPEC 3)
mahlzeit_korridore:
  fruehstueck:   {kcal_min: 500, kcal_max: 650, protein_min: 35}
  hauptgericht:  {kcal_min: 600, kcal_max: 850, protein_min: 45}
  kalorienarm:   {kcal_min: null, kcal_max: 550, protein_min: 35}
  snack:         {kcal_min: 200, kcal_max: 350, protein_min: 20}

# Planungsregeln (SPEC 8.2)
planung:
  protein_min_g: 145            # Priorität 1
  kcal_toleranz: 100            # Priorität 2: Ziel ± 100
  fett_toleranz_g: 15
  fett_min_g: 70                # nie darunter
  kh_toleranz_g: 20
  faktor_schritt: 0.25
  faktor_max: 1.5
  frisch_max_tage_nach_einkauf: 2   # Fisch, Garnelen, Hack; sonst TK + Auftau-Erinnerung
  drei_sterne_max_pro_woche: 1
  auswaerts_platzhalter: {kcal: 950, protein_g: 40, fett_g: 45, kh_g: 90}

# Küchenausstattung (Onboarding 22.10.2026)
ausstattung:
  herd: {art: Ceran, stufen: 9}           # Angaben als „Stufe X von 9“; Ceran reagiert träge
  ofen: {modi: [Ober-/Unterhitze, Umluft]}
  geraete: [Airfryer, Standmixer, Waffeleisen, Mikrowelle]
  pfannen: ["Pfanne 28 cm", "Pfanne 24 cm"]
  formen: ["Auflaufform 20 × 20 cm", "Auflaufform ca. 30 × 20 cm", "Muffinblech 12er"]
  # Töpfe, Pürierstab, Reiskocher: nicht abgefragt – bei Bedarf ergänzen

einkauf:
  supermaerkte: [REWE, Lidl/Aldi]
  tage: [{tag: Sa, art: gross}]           # 1× pro Woche
  budget_eur_pro_woche: 100
  # Reihenfolge der Abteilungen in der Einkaufsliste – an den eigenen Laden anpassbar
  abteilungen:
    - Obst & Gemüse
    - Fleisch & Fisch
    - Kühlregal & Milchprodukte
    - Brot & Backwaren
    - Trockenwaren
    - Konserven & Saucen
    - Gewürze & Öle
    - Tiefkühl
    - Sonstiges

# Was auf GitHub Pages veröffentlicht wird (SPEC 10.4)
veroeffentlichen:
  rezeptbuch: true
  wochenplaene: true
  einkaufslisten: true
# Öffentliche Adresse der Web-App (GitHub Pages) – für Canonical-Link, JSON-LD url/image und Vorschau
web_url: https://mdbts9qghm-max.github.io/Chef/
# GitHub-Repository (Eigentümer/Name) – für „Eigenes Rezept“ und „Rezept löschen“ in der App
github_repo: mdbts9qghm-max/Chef

# Schichtarbeit (Onboarding Phase 5, 24.10.2026): 5-Tage-Zyklus ab dem Startdatum
schichten:
  zyklus: [Tag, Nacht, frei, frei, frei]
  start: 2026-11-01            # erster Tag im Zyklus = Tagschicht
  zeiten: {Tag: "07:00–19:00", Nacht: "19:00–07:00"}
  mikrowelle_arbeit: true
  # Mitgenommene Mahlzeiten (Box) je Schichttyp
  boxen: {Tag: [fruehstueck, mittag], Nacht: [abend]}
  # Meal Prep am letzten freien Tag vor der Tagschicht, sonst frisch kochen
  kochtag_regel: letzter freier Tag vor Tagschicht

# Essenszeiten je Tagtyp (für die Zeitpläne im Wochenplan)
essenszeiten:
  Tag:   {fruehstueck: "09:30", mittag: "13:00", abend: "19:45", snack: "16:00"}
  Nacht: {fruehstueck: "14:00", mittag: "17:30", abend: "01:00", snack: "04:00"}
  frei:  {fruehstueck: "08:30", mittag: "12:30", abend: "18:30", snack: "15:30"}

# Fettziel (Entscheidung 25.10.2026): Rezepte sind fettreicher, Pläne treffen das Fettziel ohne Nüsse-Extras.
# Extras (Mandeln/Erdnussbutter) nur noch als Notlösung, wenn ein Tag trotzdem unter dem Minimum liegt.
fett_strategie: rezepte

region:
  sprache: de
  zeitzone: Europe/Berlin
  datumsformat: TT.MM.JJJJ
